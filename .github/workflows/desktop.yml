# 配布用のデスクトップアプリ（Windows の exe）を作って、GitHub の Releases に置く
# - ブランチに push するたびに「最新版（desktop-latest）」を作り直す
# - v1.0.0 のようなタグを付けたら、その版のリリースを作る
# - Actions の画面から手動でも実行できる
# - 読み上げ音声（voice-pack/audio）も zip にして一緒に置く
# - ファイルの指紋（SHA-256）と、GitHub のビルドの証明（Artifact Attestation）を付ける
name: Desktop app (Windows)

on:
  push:
    branches:
      - main
      - claude/nextjs-project-setup-dbddo0
    tags:
      - "v*"
    paths:
      - "src/**"
      - "public/**"
      - "bridge/**"
      - "electron/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/desktop.yml"
      - ".github/release-notes.md"
      - "voice-pack/audio/**"
      - "voice-pack/CREDITS.md"
      - "SAFETY.md"
  workflow_dispatch:

permissions:
  contents: write
  # ビルドの証明（attest-build-provenance）に使う
  id-token: write
  attestations: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the exe
        run: npm run dist:win

      # 21 種類の声の音声。展開した audio フォルダを、アプリの「音声ファイルを読み込む」でまとめて読み込む
      - name: Zip the voice pack
        shell: pwsh
        run: |
          $dir = "SyurabaBooster-voices"
          New-Item -ItemType Directory -Force "$dir/audio" | Out-Null
          Copy-Item voice-pack/audio/*.ogg "$dir/audio/"
          Copy-Item voice-pack/CREDITS.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath release/SyurabaBooster-voices.zip -Force

      # 配っているファイルがこのビルドのものか、誰でも確かめられるようにする（SAFETY.md の 5）
      - name: Checksums (SHA-256)
        shell: bash
        run: |
          cd release
          sha256sum *.exe SyurabaBooster-voices.zip | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/SyurabaBooster-voices.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SyurabaBooster-windows
          path: |
            release/*.exe
            release/SyurabaBooster-voices.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish "desktop-latest"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s/__SHA__/$GITHUB_SHA/" .github/release-notes.md
          gh release delete desktop-latest --yes --cleanup-tag || true
          {
            echo
            echo "## ファイルの指紋（SHA-256）"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            echo "ビルドの記録: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> .github/release-notes.md
          gh release create desktop-latest release/*.exe release/SyurabaBooster-voices.zip release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "進捗ブースター 最新版（Windows）" \
            --notes-file .github/release-notes.md

      - name: Publish the tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s/__SHA__/$GITHUB_SHA/" .github/release-notes.md
          {
            echo
            echo "## ファイルの指紋（SHA-256）"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            echo "ビルドの記録: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> .github/release-notes.md
          gh release create "$GITHUB_REF_NAME" release/*.exe release/SyurabaBooster-voices.zip release/SHA256SUMS.txt \
            --title "進捗ブースター $GITHUB_REF_NAME（Windows）" \
            --notes-file .github/release-notes.md
